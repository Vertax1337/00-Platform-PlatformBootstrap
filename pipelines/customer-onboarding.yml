trigger: none
pr: none

# Customer-Onboarding provisions the customer boundary and documentation capabilities only.
# AVD and Vaultwarden are IaC products under 20-IaC and are deliberately not selectable here.

parameters:
- name: customerNumber
  displayName: Customer / Debitor number
  type: string
  default: ''

- name: customerName
  displayName: Customer name
  type: string
  default: ''

- name: customerSlug
  displayName: Customer slug (AUTO = generate from customer name)
  type: string
  default: 'AUTO'

- name: tenantId
  displayName: Azure Tenant ID (optional)
  type: string
  default: ''

- name: azureDocumentation
  displayName: AzureDocumentation
  type: boolean
  default: true

- name: opnsenseDocumentation
  displayName: OPNsenseDocumentation
  type: boolean
  default: false

- name: firewalls
  displayName: Firewalls / sites (comma-separated, optional)
  type: string
  default: ''

variables:
  # Target service connection for the technician path.
  # Must be created in 00-Platform and granted only the Azure DevOps permissions
  # required by PlatformBootstrap. Do not replace with a broad Owner-style identity.
  azureDevOpsServiceConnection: 'sc-platform-bootstrap-azdo'

pool:
  vmImage: windows-latest

stages:
- stage: Validate
  displayName: Validate input
  jobs:
  - job: ValidateInput
    displayName: Validate onboarding parameters
    steps:
    - checkout: self
      clean: true
    - pwsh: |
        $ErrorActionPreference = 'Stop'

        if ([string]::IsNullOrWhiteSpace('${{ parameters.customerNumber }}')) {
          throw 'CustomerNumber is required.'
        }

        if ([string]::IsNullOrWhiteSpace('${{ parameters.customerName }}')) {
          throw 'CustomerName is required.'
        }

        if (-not [string]::IsNullOrWhiteSpace('${{ parameters.tenantId }}')) {
          $tenant = [guid]::Empty
          if (-not [guid]::TryParse('${{ parameters.tenantId }}', [ref]$tenant)) {
            throw 'TenantId is not a valid GUID.'
          }
        }

        Write-Host '[OK] Input validation passed.'
      displayName: Validate parameters

- stage: DryRun
  displayName: Bootstrap dry run
  dependsOn: Validate
  condition: succeeded()
  jobs:
  - job: DryRun
    displayName: Generate onboarding plan
    steps:
    - checkout: self
      clean: true
    - task: AzureCLI@3
      name: DryRunState
      displayName: Run complete customer onboarding - DRY RUN
      inputs:
        connectionType: azureDevOps
        azureDevOpsServiceConnection: '$(azureDevOpsServiceConnection)'
        scriptType: pscore
        scriptLocation: inlineScript
        allowNoSubscriptions: true
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $modules = @()
          if ('${{ parameters.azureDocumentation }}' -eq 'True') { $modules += 'AzureDocumentation' }
          if ('${{ parameters.opnsenseDocumentation }}' -eq 'True') { $modules += 'OPNsenseDocumentation' }

          $scriptParameters = @{
            OrganizationUrl = '$(System.CollectionUri)'
            CustomerNumber  = '${{ parameters.customerNumber }}'
            CustomerName    = '${{ parameters.customerName }}'
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.customerSlug }}') -and '${{ parameters.customerSlug }}' -ne 'AUTO') {
            $scriptParameters.CustomerSlug = '${{ parameters.customerSlug }}'
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.tenantId }}')) {
            $scriptParameters.TenantId = '${{ parameters.tenantId }}'
          }

          if ($modules.Count -gt 0) {
            $scriptParameters.Modules = @($modules)
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.firewalls }}')) {
            $scriptParameters.Firewalls = '${{ parameters.firewalls }}'
          }

          Write-Host '=== DRY RUN: CUSTOMER BOUNDARY ==='
          $boundaryOutput = & "$(Build.SourcesDirectory)\bootstrap\New-BSSECustomerProject.ps1" @scriptParameters *>&1
          $boundaryOutput | ForEach-Object { Write-Host $_ }

          Write-Host '=== DRY RUN: CUSTOMERCONFIGURATION ==='
          $configOutput = & "$(Build.SourcesDirectory)\bootstrap\Sync-BSSECustomerConfiguration.ps1" @scriptParameters *>&1
          $configOutput | ForEach-Object { Write-Host $_ }

          $text = (($boundaryOutput + $configOutput) | Out-String)
          if ($text -match '\[BLOCKED\]') {
            throw 'Dry Run contains a BLOCKED state. Apply is not permitted.'
          }

          $hasChanges = ($text -match '\[PLAN\]')
          Write-Host "##vso[task.setvariable variable=hasChanges;isOutput=true]$($hasChanges.ToString().ToLowerInvariant())"

          if ($hasChanges) {
            Write-Host '[PLAN] Changes require review and approval.'
          }
          else {
            Write-Host '[OK] Desired state including CustomerConfiguration is already present. Approval/Apply will be skipped.'
          }

- stage: Approval
  displayName: Review dry run
  dependsOn: DryRun
  condition: and(succeeded(), eq(dependencies.DryRun.outputs['DryRun.DryRunState.hasChanges'], 'true'))
  jobs:
  - job: ManualReview
    displayName: Technician approval
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@1
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: |
          Review the complete Dry Run output.
          Approve only if project, repositories, documentation capabilities, CustomerConfiguration changes and firewall repositories match the intended customer onboarding and no unexpected operation is shown.
          This pipeline does not deploy AVD or Vaultwarden; IaC products are handled separately under 20-IaC.
        onTimeout: reject

- stage: Apply
  displayName: Apply onboarding
  dependsOn: Approval
  condition: succeeded()
  jobs:
  - job: Apply
    displayName: Provision customer and persist configuration
    steps:
    - checkout: self
      clean: true
    - task: AzureCLI@3
      displayName: Run complete customer onboarding - APPLY
      inputs:
        connectionType: azureDevOps
        azureDevOpsServiceConnection: '$(azureDevOpsServiceConnection)'
        scriptType: pscore
        scriptLocation: inlineScript
        allowNoSubscriptions: true
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $modules = @()
          if ('${{ parameters.azureDocumentation }}' -eq 'True') { $modules += 'AzureDocumentation' }
          if ('${{ parameters.opnsenseDocumentation }}' -eq 'True') { $modules += 'OPNsenseDocumentation' }

          $scriptParameters = @{
            OrganizationUrl = '$(System.CollectionUri)'
            CustomerNumber  = '${{ parameters.customerNumber }}'
            CustomerName    = '${{ parameters.customerName }}'
            Apply           = $true
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.customerSlug }}') -and '${{ parameters.customerSlug }}' -ne 'AUTO') {
            $scriptParameters.CustomerSlug = '${{ parameters.customerSlug }}'
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.tenantId }}')) {
            $scriptParameters.TenantId = '${{ parameters.tenantId }}'
          }

          if ($modules.Count -gt 0) {
            $scriptParameters.Modules = @($modules)
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.firewalls }}')) {
            $scriptParameters.Firewalls = '${{ parameters.firewalls }}'
          }

          Write-Host '=== APPLY: CUSTOMER BOUNDARY ==='
          & "$(Build.SourcesDirectory)\bootstrap\New-BSSECustomerProject.ps1" @scriptParameters

          Write-Host '=== APPLY: CUSTOMERCONFIGURATION ==='
          & "$(Build.SourcesDirectory)\bootstrap\Sync-BSSECustomerConfiguration.ps1" @scriptParameters

- stage: Verify
  displayName: Verify idempotency
  dependsOn: Apply
  condition: succeeded()
  jobs:
  - job: Verify
    displayName: Re-run complete dry run and verify no changes
    steps:
    - checkout: self
      clean: true
    - task: AzureCLI@3
      displayName: Verify desired state
      inputs:
        connectionType: azureDevOps
        azureDevOpsServiceConnection: '$(azureDevOpsServiceConnection)'
        scriptType: pscore
        scriptLocation: inlineScript
        allowNoSubscriptions: true
        inlineScript: |
          $ErrorActionPreference = 'Stop'

          $modules = @()
          if ('${{ parameters.azureDocumentation }}' -eq 'True') { $modules += 'AzureDocumentation' }
          if ('${{ parameters.opnsenseDocumentation }}' -eq 'True') { $modules += 'OPNsenseDocumentation' }

          $scriptParameters = @{
            OrganizationUrl = '$(System.CollectionUri)'
            CustomerNumber  = '${{ parameters.customerNumber }}'
            CustomerName    = '${{ parameters.customerName }}'
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.customerSlug }}') -and '${{ parameters.customerSlug }}' -ne 'AUTO') {
            $scriptParameters.CustomerSlug = '${{ parameters.customerSlug }}'
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.tenantId }}')) {
            $scriptParameters.TenantId = '${{ parameters.tenantId }}'
          }

          if ($modules.Count -gt 0) {
            $scriptParameters.Modules = @($modules)
          }

          if (-not [string]::IsNullOrWhiteSpace('${{ parameters.firewalls }}')) {
            $scriptParameters.Firewalls = '${{ parameters.firewalls }}'
          }

          Write-Host '=== VERIFY: CUSTOMER BOUNDARY ==='
          $boundaryOutput = & "$(Build.SourcesDirectory)\bootstrap\New-BSSECustomerProject.ps1" @scriptParameters *>&1
          $boundaryOutput | ForEach-Object { Write-Host $_ }

          Write-Host '=== VERIFY: CUSTOMERCONFIGURATION ==='
          $configOutput = & "$(Build.SourcesDirectory)\bootstrap\Sync-BSSECustomerConfiguration.ps1" @scriptParameters *>&1
          $configOutput | ForEach-Object { Write-Host $_ }

          $text = (($boundaryOutput + $configOutput) | Out-String)
          if ($text -match '\[(PLAN|CREATE|RENAME|BLOCKED)\]') {
            throw 'Post-Apply verification found a pending or blocked change. Desired state is not idempotent.'
          }

          Write-Host '[OK] Customer boundary and persistent CustomerConfiguration are idempotent.'
